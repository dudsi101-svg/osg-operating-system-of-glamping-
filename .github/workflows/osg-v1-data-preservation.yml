name: OSG v1 data preservation proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'database/**'
      - 'tools/fingerprint_public_data.py'
      - 'tests/integration/data_preservation_v1.sh'
      - 'tests/sql/**'
      - '.github/workflows/osg-v1-data-preservation.yml'
  push:
    branches:
      - 'agent/engineering/clean-load-ci'
    paths:
      - 'database/**'
      - 'tools/fingerprint_public_data.py'
      - 'tests/integration/data_preservation_v1.sh'
      - 'tests/sql/**'
      - '.github/workflows/osg-v1-data-preservation.yml'

permissions:
  contents: read

jobs:
  data-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install proof dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
          psql --version
          pg_dump --version
          pg_restore --version
          python -m py_compile tools/fingerprint_public_data.py database/migrations/apply.py

      - name: Execute representative data-preservation gate
        shell: bash
        run: bash tests/integration/data_preservation_v1.sh

      - name: Upload preservation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osg-v1-data-preservation-${{ github.run_id }}
          path: artifacts/data-preservation/
          if-no-files-found: warn
          retention-days: 14
